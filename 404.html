<!doctype html>

<head>

    .error-header{position:fixed;top:0;left:0;width:100%;z-index:100;background:rgba(255,249,240,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,26,23,.09)}
    .error-header .header-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-inline:var(--gutter)}
    .error-header .language-switcher{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:2px;border:1px solid rgba(0,26,23,.16);border-radius:999px;background:rgba(255,249,240,.72)}
    .error-header .language-option{border:0;background:transparent;color:rgba(0,26,23,.58);font:800 10px/1 var(--heading);letter-spacing:.04em;min-width:29px;min-height:33px;padding:0 7px;border-radius:999px;cursor:pointer}
    .error-header .language-option.is-active{color:var(--cream);background:var(--dark)}
    .error-header .language-switcher>span{color:rgba(0,26,23,.22);font-size:10px}

  </style>
<link rel="stylesheet" href="css/site.bundle.css?v=133cc1a65c">
<link rel="manifest" href="/manifest.json">
</head>
<body class="legal-page">
<a href="#main" class="skip-link">Aller au contenu principal</a>
  <header class="error-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="LNK Design Touch — accueil"><img class="brand-logo" src="assets/images/brand/logo-primary-dark.svg" alt="LNK Design Touch" width="180" height="48"></a>
    </div>

  <a class="lnk-wa-fab" href="https://wa.me/c/243998222431" target="_blank" rel="noopener" aria-label="Catalogue WhatsApp LNK Design Touch"><span class="lnk-wa-pulse" aria-hidden="true"></span><i data-lucide="store" aria-hidden="true"></i></a>
<script>
(function(){const html=document.documentElement;const options=document.querySelectorAll('.language-option');options.forEach(btn=>btn.addEventListener('click',()=>{const lang=btn.dataset.lang;if(lang==='en'){location.href='/?lang=en';return;}html.dataset.lang='fr';options.forEach(o=>{const active=o===btn;o.classList.toggle('is-active',active);o.setAttribute('aria-pressed',String(active));});localStorage.setItem('lnk-lang','fr');}));if(window.lucide)window.lucide.createIcons();})();
</script>
