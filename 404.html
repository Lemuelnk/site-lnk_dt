<!doctype html>
<html lang="fr" data-lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page introuvable — LNK Design Touch</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/legal.css">
  <link rel="stylesheet" href="css/lucide-overrides.css">
  <style>
    .error-header{position:fixed;top:0;left:0;width:100%;z-index:100;background:rgba(255,249,240,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,26,23,.09)}
    .error-header .header-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-inline:var(--gutter)}
    .error-header .language-switcher{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:2px;border:1px solid rgba(0,26,23,.16);border-radius:999px;background:rgba(255,249,240,.72)}
    .error-header .language-option{border:0;background:transparent;color:rgba(0,26,23,.58);font:800 10px/1 var(--heading);letter-spacing:.04em;min-width:29px;min-height:33px;padding:0 7px;border-radius:999px;cursor:pointer}
    .error-header .language-option.is-active{color:var(--cream);background:var(--dark)}
    .error-header .language-switcher>span{color:rgba(0,26,23,.22);font-size:10px}
    .error-page{padding-top:68px}
    .lnk-wa-fab{position:fixed;right:clamp(16px,3vw,28px);bottom:clamp(16px,3vw,28px);z-index:900;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--dark);color:var(--cream);text-decoration:none;box-shadow:0 6px 18px rgba(0,26,23,.28);transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
    .lnk-wa-fab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 10px 24px rgba(0,26,23,.32);background:var(--teal)}
    .lnk-wa-fab svg{width:28px;height:28px;stroke:currentColor}
    .lnk-wa-pulse{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--teal);opacity:0;animation:lnk-wa-pulse 2.4s ease-out infinite}
    @keyframes lnk-wa-pulse{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.25);opacity:0}}
    @media(max-width:760px){.lnk-wa-fab{bottom:88px}.error-header .header-inner{padding-inline:16px}}
    @media(max-width:480px){.lnk-wa-fab{width:50px;height:50px}.lnk-wa-fab svg{width:24px;height:24px}}
    @media(prefers-reduced-motion:reduce){.lnk-wa-fab{transition:none}.lnk-wa-pulse{animation:none}}
  </style>
</head>
<body class="legal-page">
  <header class="error-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="LNK Design Touch — accueil"><img class="brand-logo" src="assets/images/brand/logo-primary-dark.svg" alt="LNK Design Touch" width="180" height="48"></a>
      <div class="language-switcher" data-lnk-language></div>
    </div>
  </header>
  <main class="legal-wrap error-page">
    <p class="legal-kicker">LNK DESIGN TOUCH</p>
    <h1>Cette page n'existe pas.</h1>
    <p class="legal-note">Le lien a peut-être été déplacé ou l'adresse est incorrecte.</p>
    <a class="legal-back" href="/">Retour au site</a>
  </main>
  <a class="lnk-wa-fab" href="https://wa.me/c/243998222431" target="_blank" rel="noopener" aria-label="Catalogue WhatsApp LNK Design Touch"><span class="lnk-wa-pulse" aria-hidden="true"></span><i data-lucide="store" aria-hidden="true"></i></a>
<script>
(function(){const html=document.documentElement;const options=document.querySelectorAll('.language-option');options.forEach(btn=>btn.addEventListener('click',()=>{const lang=btn.dataset.lang;if(lang==='en'){location.href='/?lang=en';return;}html.dataset.lang='fr';options.forEach(o=>{const active=o===btn;o.classList.toggle('is-active',active);o.setAttribute('aria-pressed',String(active));});localStorage.setItem('lnk-lang','fr');}));if(window.lucide)window.lucide.createIcons();})();
</script>
</body>
</html>
