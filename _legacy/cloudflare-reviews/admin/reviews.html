<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>LNK_DT — Modération des avis</title>
<style>
:root{--dark:#001a17;--teal:#009688;--cream:#fff9f0;--coral:#ff7043;--yellow:#ffc107}*{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--cream);font-family:Arial,sans-serif}main{width:min(1100px,calc(100% - 32px));margin:40px auto 80px}h1{font-size:clamp(32px,6vw,60px);line-height:.95;margin:0 0 12px}p{color:rgba(255,249,240,.68)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.toolbar input{flex:1;min-width:240px;padding:13px;background:rgba(255,249,240,.05);border:1px solid rgba(255,249,240,.2);color:var(--cream)}button{padding:12px 16px;border:1px solid rgba(255,249,240,.25);background:transparent;color:var(--cream);cursor:pointer}button.primary{background:var(--teal);border-color:var(--teal);color:var(--dark);font-weight:700}.card{border:1px solid rgba(255,249,240,.14);padding:22px;margin:14px 0}.stars{color:var(--yellow);font-size:20px}.meta{display:flex;gap:18px;flex-wrap:wrap;color:rgba(255,249,240,.55);font-size:13px}.review{font-size:18px;line-height:1.6}.actions{display:flex;gap:10px;margin-top:18px}.danger{border-color:var(--coral);color:var(--coral)}#status{margin:14px 0}.hidden{display:none!important}</style></head>
<body><main><p>08 / AVIS CLIENTS</p><h1>Modération<br>des avis.</h1><p>Cette interface est destinée à l'administration de LNK Design Touch. Les avis soumis par les visiteurs restent en attente jusqu'à validation.</p>
<div class="toolbar"><input id="token" type="password" placeholder="Token administrateur"><button id="save">Enregistrer le token</button><button class="primary" id="load">Charger les avis en attente</button></div><p id="status"></p><section id="list"></section></main>
<script>
const tokenKey='lnk_reviews_admin_token';const token=document.getElementById('token');const list=document.getElementById('list');const status=document.getElementById('status');token.value=sessionStorage.getItem(tokenKey)||'';document.getElementById('save').onclick=()=>{sessionStorage.setItem(tokenKey,token.value.trim());status.textContent='Token enregistré pour cette session.'};
async function load(){const t=token.value.trim();if(!t){status.textContent='Entrez le token administrateur.';return}status.textContent='Chargement…';try{const r=await fetch('/api/review-admin?status=pending',{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();if(!r.ok)throw new Error(d.message||'Erreur');list.innerHTML=d.testimonials.length?d.testimonials.map(x=>`<article class="card" data-id="${x.id}"><div class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div><h2>${esc(x.name)}</h2><div class="meta"><span>${esc(x.organization||'')}</span><span>${esc(x.project||'')}</span><span>${esc(x.created_at||'')}</span></div><p class="review">“${esc(x.review)}”</p><div class="actions"><button class="primary" onclick="moderate('${x.id}','approve')">Approuver</button><button class="danger" onclick="moderate('${x.id}','reject')">Refuser</button></div></article>`).join(''):'<p>Aucun avis en attente.</p>';status.textContent=`${d.testimonials.length} avis en attente.`}catch(e){status.textContent=e.message}}
async function moderate(id,action){const t=token.value.trim();const r=await fetch('/api/review-admin',{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({id,action})});const d=await r.json();if(!r.ok){status.textContent=d.message||'Erreur';return}load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('load').onclick=load;
</script></body></html>
