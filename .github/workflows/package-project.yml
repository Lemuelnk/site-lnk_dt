name: Package project
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/package-project.yml'
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          zip -r LNK_Design_Touch_site-master.zip . -x '.git/*' '.github/workflows/package-project.yml'
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LNK_Design_Touch_site-master
          path: LNK_Design_Touch_site-master.zip
          if-no-files-found: error
