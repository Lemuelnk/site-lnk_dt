name: Generate portfolio catalog

on:
  push:
    branches: [master]
    paths:
      - 'assets/images/portfolio/**'
      - 'tools/generate-portfolio-catalog.py'
      - 'tools/build-bundles.py'
      - '.deploy-trigger'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate catalog
        run: python3 tools/generate-portfolio-catalog.py

      - name: Build stable assets
        run: python3 tools/build-bundles.py

      - name: Commit generated catalog and stable assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/portfolio.json js/portfolio-catalog.js js/site.bundle.js css/site.bundle.css
          git add -A css/brand.bundle.css css/legal.bundle.css css/admin-reviews.css
          git add -A '*.html'
          git diff --cached --quiet || git commit -m "chore: regenerate portfolio catalog"
          git push
