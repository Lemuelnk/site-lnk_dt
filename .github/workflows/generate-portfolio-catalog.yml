name: Generate portfolio catalog

on:
  push:
    branches: [master]
    paths:
      - 'assets/images/portfolio/**'
      - 'tools/generate-portfolio-catalog.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate catalog
        run: python3 tools/generate-portfolio-catalog.py

      - name: Build portfolio bundle
        run: python3 tools/build-bundles.py

      - name: Commit generated catalog and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json js/portfolio-catalog.js
          git add js/site.bundle.*.js css/site.bundle.*.css css/brand.bundle.*.css css/legal.bundle.*.css
          git add index.html brand.html mentions-legales.html politique-confidentialite.html mentions-legales-en.html politique-confidentialite-en.html
          git diff --cached --quiet || git commit -m "chore: regenerate portfolio catalog"
          git push
